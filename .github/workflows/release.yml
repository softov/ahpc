name: Release

# A pushed tag is the whole gesture: `git tag v0.2.1 && git push --tags`.
# Nothing publishes from a branch, and nothing publishes from a fork.
on:
  push:
    tags: ['v*']
  # For rehearsing the whole thing without publishing anything.
  workflow_dispatch:
    inputs:
      dry_run:
        description: Pack and check, but do not publish
        type: boolean
        default: true

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      # What lets npm trade a GitHub OIDC token for a publish. Without it the
      # publish falls back to looking for a token that is not there.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Trusted publishing needs 22.14 or later, and this is the version
          # the tests are written against.
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      # The npm bundled with Node 22 is 10.x, which has neither trusted
      # publishing (11.5.1 and later) nor `npm stage` (12). Without this the
      # release fails at the last step, having done everything else.
      - name: An npm that can do this
        run: |
          npm install -g npm@12
          npm --version

      - run: npm ci

      # The tag is a claim about what is in package.json, and a tag that
      # disagrees with it publishes a version nobody asked for. Checked before
      # anything is built, so a mistyped tag costs seconds.
      - name: The tag says what package.json says
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -eu
          tagged=${GITHUB_REF_NAME#v}
          manifest=$(node -p "require('./package.json').version")
          if [ "$tagged" != "$manifest" ]; then
            echo "The tag says $tagged and package.json says $manifest."
            exit 1
          fi
          echo "Releasing $manifest."

      # The same checks CI runs. A release is the one build where a green tick
      # somewhere else is not good enough.
      - run: npm run typecheck
      - run: timeout 600 npm test
      - run: npm run build

      # Staged, not published. The version is uploaded and held, and nothing is
      # installable until somebody approves it on the package page - which is
      # npm's own recommendation, and the right gate for the one action in this
      # repository that cannot be undone. A tag can be pushed by accident; an
      # npm version cannot be unpublished.
      #
      # `--provenance` attaches a signed attestation tying this tarball to this
      # commit and this workflow, which npm shows on the package page.
      - name: Stage the release
        if: ${{ inputs.dry_run != true }}
        run: npm stage publish --provenance --access public

      - name: Say what is waiting
        if: ${{ inputs.dry_run != true }}
        run: |
          echo "Staged. Approve it at https://www.npmjs.com/package/@softov/ahpc"
          echo "The approve button stays disabled until npm has finished scanning."

      # A rehearsal on a tree whose version is already on npm is refused, which
      # is right and is not a failure of this workflow - it is what every dry
      # run before a bump looks like. Recognised so the rehearsal stays usable
      # at any point, and so anything else still fails.
      - name: What would have been staged
        if: ${{ inputs.dry_run == true }}
        run: |
          set -u
          said=$(npm stage publish --dry-run --access public 2>&1) && code=0 || code=$?
          echo "$said"
          if [ "$code" = "0" ]; then exit 0; fi
          if printf '%s' "$said" | grep -q 'cannot publish over'; then
            echo
            echo "That version is already on npm. Expected until package.json is bumped."
            exit 0
          fi
          exit "$code"
