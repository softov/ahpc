name: Release

# A pushed tag is the whole gesture: `git tag v0.2.1 && git push --tags`.
# Nothing publishes from a branch, and nothing publishes from a fork.
on:
  push:
    tags: ['v*']
  # For rehearsing the whole thing without publishing anything.
  workflow_dispatch:
    inputs:
      dry_run:
        description: Pack and check, but do not publish
        type: boolean
        default: true

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      # What lets npm trade a GitHub OIDC token for a publish. Without it the
      # publish falls back to looking for a token that is not there.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Trusted publishing needs 22.14 or later, and this is the version
          # the tests are written against.
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm ci

      # The tag is a claim about what is in package.json, and a tag that
      # disagrees with it publishes a version nobody asked for. Checked before
      # anything is built, so a mistyped tag costs seconds.
      - name: The tag says what package.json says
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -eu
          tagged=${GITHUB_REF_NAME#v}
          manifest=$(node -p "require('./package.json').version")
          if [ "$tagged" != "$manifest" ]; then
            echo "The tag says $tagged and package.json says $manifest."
            exit 1
          fi
          echo "Releasing $manifest."

      # The same checks CI runs. A release is the one build where a green tick
      # somewhere else is not good enough.
      - run: npm run typecheck
      - run: timeout 600 npm test
      - run: npm run build

      - name: Publish
        if: ${{ inputs.dry_run != true }}
        # `--provenance` attaches a signed attestation tying this tarball to
        # this commit and this workflow, which npm shows on the package page.
        # For a human approval step before it goes live, change this to
        # `npm stage publish` and approve it on npmjs.com.
        run: npm publish --provenance --access public

      - name: What would have been published
        if: ${{ inputs.dry_run == true }}
        run: npm publish --dry-run --access public
