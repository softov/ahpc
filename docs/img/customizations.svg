<text x="66" y="23" fill="#9b949e" textLength="8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">○</text>
<text x="74" y="23" fill="#c9d1d9" textLength="664" lengthAdjust="spacing" xml:space="preserve"> read ideas                                                                        </text>
<text x="738" y="23" fill="#9b949e" textLength="72" lengthAdjust="spacing" xml:space="preserve">notes-app</text>
<text x="10" y="40" fill="#c9d1d9" font-weight="bold" textLength="152" lengthAdjust="spacing" xml:space="preserve">Skills and commands</text>
