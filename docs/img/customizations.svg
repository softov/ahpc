<text x="42" y="57" fill="#58a6ff" font-weight="bold" textLength="72" lengthAdjust="spacing" xml:space="preserve">summarize</text>
<text x="26" y="74" fill="#58a6ff" font-weight="bold" textLength="248" lengthAdjust="spacing" xml:space="preserve">  Sums up a note in three lines</text>
<text x="26" y="91" fill="#3fb950" textLength="8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">■</text>
<text x="34" y="91" fill="#c9d1d9" textLength="40" lengthAdjust="spacing" xml:space="preserve"> tidy</text>
<text x="42" y="108" fill="#9b949e" textLength="184" lengthAdjust="spacing" xml:space="preserve">Sorts the notes by name</text>
<text x="10" y="516" fill="#58a6ff" font-weight="bold" textLength="16" lengthAdjust="spacingAndGlyphs" xml:space="preserve">↑↓</text>
<text x="34" y="516" fill="#9b949e" textLength="32" lengthAdjust="spacing" xml:space="preserve">move</text>
<text x="66" y="516" fill="#a7a7a7" textLength="24" lengthAdjust="spacing" xml:space="preserve"> · </text>
<text x="90" y="516" fill="#58a6ff" font-weight="bold" textLength="40" lengthAdjust="spacing" xml:space="preserve">enter</text>
<text x="138" y="516" fill="#9b949e" textLength="64" lengthAdjust="spacing" xml:space="preserve">on / off</text>
<text x="202" y="516" fill="#a7a7a7" textLength="24" lengthAdjust="spacing" xml:space="preserve"> · </text>
<text x="226" y="516" fill="#58a6ff" font-weight="bold" textLength="24" lengthAdjust="spacing" xml:space="preserve">esc</text>
<text x="258" y="516" fill="#9b949e" textLength="32" lengthAdjust="spacing" xml:space="preserve">back</text>
